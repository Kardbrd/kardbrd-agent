services:
  agent:
    build:
      context: ./repository
      target: agent
    user: "1000:1000"
    restart: unless-stopped
    command: ["agent", "start", "--cwd", "/home/agent/repository"]
    environment:
      - KARDBRD_API_URL=${KARDBRD_API_URL:-https://app.kardbrd.com}
      - KARDBRD_TOKEN
      - KARDBRD_AGENT_BOARD_ID
      - KARDBRD_AGENT_NAME
      - ANTHROPIC_API_KEY
      - KARDBRD_AGENT_CWD=/home/agent/repository
      - KARDBRD_AGENT_WORKTREES_DIR=/home/agent/workspaces
      - KARDBRD_AGENT_SETUP_CMD=${KARDBRD_AGENT_SETUP_CMD:-}
      - KARDBRD_AGENT_MAX_CONCURRENT=${KARDBRD_AGENT_MAX_CONCURRENT:-2}
      - KARDBRD_AGENT_TIMEOUT=${KARDBRD_AGENT_TIMEOUT:-7200}
      - KARDBRD_AGENT_EXECUTOR=${KARDBRD_AGENT_EXECUTOR:-claude}
      # - GOOSE_PROVIDER=anthropic
      - GIT_AUTHOR_NAME=Kardbrd Agent
      - GIT_AUTHOR_EMAIL=agent@example.com
      - GIT_COMMITTER_NAME=Kardbrd Agent
      - GIT_COMMITTER_EMAIL=agent@example.com
    volumes:
      # Base repository (read-write)
      - ./repository:/home/agent/repository

      # Worktrees (separate from repo)
      - ./workspaces:/home/agent/workspaces

      # Claude CLI home (API creds, session data, settings)
      - ./claude:/home/agent/.claude

      # SSH key (read-only) — use a DEDICATED key, not personal
      - ./ssh/id_ed25519:/home/agent/.ssh/id_ed25519:ro
